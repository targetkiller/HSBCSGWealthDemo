name: WealthHub
options:
  bundleIdPrefix: com.wealthhub
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  WealthHub:
    type: application
    platform: iOS
    sources:
      - path: WealthHub
      - path: Sample
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wealthhub.demo
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HSBC SG
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSCameraUsageDescription: Take a photo of a statement to review its holdings on this device.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Choose a statement image to review its holdings on this device.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
  WealthHubTests:
    type: bundle.unit-test
    platform: iOS
    sources: [WealthHubTests]
    dependencies:
      - target: WealthHub
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  WealthHubUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [WealthHubUITests]
    dependencies:
      - target: WealthHub
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WealthHub:
    build:
      targets:
        WealthHub: all
    test:
      targets: [WealthHubTests, WealthHubUITests]
